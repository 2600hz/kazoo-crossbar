---
version: 2.1

orbs:
  kazoo: official-2600hz/kazoo@dev:alpha

workflows:
  version: 2
  build_branch:
    jobs:
      - kazoo/setup:
          target-type: kapps
          target-name: crossbar
          base-branch: origin/master
      - kazoo/build-preparation:
          requires:
            - kazoo/setup
      - kazoo/build:
          requires:
            - kazoo/build-preparation
      - kazoo/eunit-tests:
          requires:
            - kazoo/build-preparation
      - kazoo/code-checks:
          requires:
            - kazoo/build
      - kazoo/docs:
          requires:
            - kazoo/build
      - kazoo/analyze:
          requires:
            - kazoo/build
      - kazoo/integration-test:
          requires:
            - kazoo/build
      # - build_centos7:
      #     requires:
      #       - build
      #       - build_deps
      #       - eunit_tests
      #       - checks
      #       - docs
      #       - analyze
      #       - release
