---
version: 2.1

orbs:
  # num num
  kazoo: official-2600hz/kazoo@dev:alpha

workflows:
  version: 2
  build_branch:
    jobs:
      - kazoo/setup:
          app-name: crossbar
          base-branch: origin/master
      - kazoo/build-deps:
          requires:
            - kazoo/setup
      - kazoo/build:
          requires:
            - kazoo/build-deps
      - kazoo/eunit_tests:
          is-app: true
          requires:
            - kazoo/build-deps
      - kazoo/code_checks:
          requires:
            - kazoo/build
      - kazoo/docs:
          requires:
            - kazoo/build
      - kazoo/analyze:
          requires:
            - kazoo/build
      - kazoo/ci-release-run:
          requires:
            - kazoo/build
      # - build_centos7:
      #     requires:
      #       - build
      #       - build_deps
      #       - eunit_tests
      #       - checks
      #       - docs
      #       - analyze
      #       - release
