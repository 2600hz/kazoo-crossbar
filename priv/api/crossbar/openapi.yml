'info':
  'contact':
    'name': 'Great Kazoo HTTP API'
    'url': 'http://2600hz.com'
  'description': 'The Mighty Crossbar - Great Kazoo HTTP API'
  'license':
    'name': 'Mozilla Public License 1.1'
  'title': 'Kazoo HTTP API'
  'version': '2.0.0'
'openapi': '3.0.0'
'paths':
  '/accounts/{ACCOUNT_ID}/users':
    '$ref': 'paths/users.yml#/paths/~1accounts~1{ACCOUNT_ID}~1users'
  '/accounts/{ACCOUNT_ID}/users/{USER_ID}':
    '$ref': 'paths/users.yml#/paths/~1accounts~1{ACCOUNT_ID}~1users~1{USER_ID}'
  '/accounts/{ACCOUNT_ID}/users/{USER_ID}/photo':
    '$ref': 'paths/users.yml#/paths/~1accounts~1{ACCOUNT_ID}~1users~1{USER_ID}~1photo'
  '/accounts/{ACCOUNT_ID}/users/{USER_ID}/vcard':
    '$ref': 'paths/users.yml#/paths/~1accounts~1{ACCOUNT_ID}~1users~1{USER_ID}~1vcard'
'tags':
  - name: users
    description: account user api endpoint
'servers':
  - 'description': 'API target server'
    'url': '{schema}://{domain}:{port}/v2'
    'variables':
      'domain':
        'default': 'localhost'
        'description': 'API sever domain name'
      'port':
        'default': '8000'
      'schema':
        'default': 'http'
        'enum':
          - 'http'
          - 'https'
